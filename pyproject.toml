[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptojack-detector"
version = "1.0.0"
description = "Host-based, read-only cryptojacking detector with multi-signal scoring, alerting, and a monitoring daemon"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "James Baird" }]
keywords = ["security", "cryptojacking", "cryptomining", "detection", "blue-team", "psutil"]
dependencies = ["psutil>=5.9"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Topic :: Security",
  "Intended Audience :: System Administrators",
]

[project.urls]
Homepage = "https://github.com/jamesbairdjr88-star/cryptojack-detector"
Issues = "https://github.com/jamesbairdjr88-star/cryptojack-detector/issues"

[project.scripts]
cryptojack-detect = "cryptojack_detect:cli"

[tool.setuptools]
py-modules = ["cryptojack_detect"]
